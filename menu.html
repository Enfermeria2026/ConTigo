<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConTigo - Menú Principal</title>
    <link rel="stylesheet" href="menu.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <header>
        <img src="logo_contigo.png" class="logo-menu" alt="Logo ConTigo">
        <p class="subtitulo">Tecnología para todas las edades.</p>
        <h1 class="bienvenida" id="nombre-pantalla">Cargando usuario...</h1>
    </header>

    <div class="fila-superior">
        <button class="btn-fav" id="btn-fav1">+ Añadir<br>contacto favorito</button>
        <button class="btn-fav" id="btn-fav2">+ Añadir<br>contacto favorito</button>
        <button class="btn-sos" id="btn-sos">
            <img src="iconos/sos.png" alt="SOS">
            <span>Emergencias</span>
        </button>
    </div>

    <div class="cuadricula-principal">
        <!-- ¡AQUÍ ESTÁ EL ID NUEVO (id="btn-tiempo")! -->
        <button class="btn-app" id="btn-tiempo" style="background-color: var(--pastel-azul);">
            <img src="iconos/tiempo.png" alt="El tiempo"> <span>El tiempo</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-verde);">
            <img src="iconos/prensa.png" alt="Prensa"> <span>Prensa</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-amarillo);">
            <img src="iconos/stickers.png" alt="Stickers"> <span>Stickers</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-morado);">
            <img src="iconos/contactos.png" alt="Contactos"> <span>Contactos</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-naranja);">
            <img src="iconos/calendario.png" alt="Calendario"> <span>Calendario</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-azul);">
            <img src="iconos/recordatorios.png" alt="Recordatorios"> <span>Recordatorios</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-rojo);">
            <img src="iconos/salud.png" alt="Salud"> <span>Salud</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-morado);">
            <img src="iconos/eventos.png" alt="Eventos"> <span>Eventos cerca de ti</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-verde);">
            <img src="iconos/compra.png" alt="Lista"> <span>Lista de la compra</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-marron);">
            <img src="iconos/viajes.png" alt="Viajes"> <span>Viajes</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-rojo);">
            <img src="iconos/videos.png" alt="Vídeos"> <span>Vídeos</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-rosa);">
            <img src="iconos/calculadora.png" alt="Calculadora"> <span>Calculadora</span>
        </button>
    </div>

    <div class="separador-servicios">
        <div class="linea-verde"></div>
        <span class="texto-servicios">Servicios locales</span>
        <div class="linea-verde"></div>
    </div>

    <div class="cuadricula-principal">
        <button class="btn-app" style="background-color: var(--pastel-verde);">
            <img src="iconos/telefonos.png" alt="Tel"> <span>Teléfonos útiles</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-amarillo);">
            <img src="iconos/farmacia.png" alt="Farmacia"> <span>Farmacias de guardia</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-azul);">
            <img src="iconos/transporte.png" alt="Transporte"> <span>Transporte local</span>
        </button>
        <button class="btn-app" style="background-color: var(--pastel-verde);">
            <img src="iconos/whatsapp.png" alt="WhatsApp"> <span>Whatsapp</span>
        </button>
    </div>
    
   <footer>
        <div class="texto-footer"><span class="marca-verde">ConTigo</span>, siempre</div>
        <div class="grupo-botones-footer">
            <button class="btn-perfil" id="btn-perfil">
                <img src="iconos/perfil.png" alt="Perfil">
            </button>
            <button class="btn-salir" id="btn-salir">Salir</button>
        </div>
    </footer>

    <div id="modal-cumple" class="modal-cumple oculto">
        <div class="contenido-cumple">
            <h1>¡Feliz Cumpleaños! 🎉🎂</h1>
            <p id="texto-cumple"></p>
            <button class="btn-gracias" id="btn-cerrar-cumple">¡Muchas Gracias!</button>
        </div>
    </div>

  <!-- Modal 1: Opciones del Contacto Favorito -->
    <div id="modal-opciones-fav" class="modal-centrado oculto">
        <div class="contenido-tutorial">
            <h1 id="titulo-opciones-fav">Nombre</h1>
            <button class="btn-tutorial" id="btn-opcion-llamar" style="background-color: #2ECC71; margin-bottom: 15px;">📞 Llamar</button>
            <button class="btn-tutorial" id="btn-opcion-editar" style="background-color: #F39C12; margin-bottom: 15px;">✏️ Editar</button>
            <button class="btn-tutorial" id="btn-opcion-eliminar" style="background-color: #E74C3C; margin-bottom: 15px;">🗑️ Eliminar</button>
            <button class="btn-tutorial" id="btn-opcion-cancelar" style="background-color: #95A5A6;">Cancelar</button>
        </div>
    </div>

    <!-- Modal 2: Formulario para Añadir o Editar Contacto -->
    <div id="modal-formulario-fav" class="modal-centrado oculto">
        <div class="contenido-tutorial">
            <h1 id="titulo-formulario-fav">Añadir Contacto</h1>
            
            <button class="btn-tutorial" id="btn-agenda-fav" style="background-color: #3498DB; margin-bottom: 15px; font-size: 1.1rem;">📖 Elegir de mi agenda</button>
            
            <input type="text" id="input-fav-nombre" placeholder="Nombre (Ej: María)" style="width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #E5E8E8; font-size: 1.2rem; margin-bottom: 15px; box-sizing: border-box;">
            <input type="tel" id="input-fav-tel" placeholder="Teléfono (Ej: 600123456)" style="width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #E5E8E8; font-size: 1.2rem; margin-bottom: 10px; box-sizing: border-box;">
            <p id="error-fav" style="color: #E74C3C; font-size: 0.9rem; margin-top: 0; margin-bottom: 15px;" class="oculto">Error.</p>
            
            <button class="btn-tutorial" id="btn-guardar-fav" style="margin-bottom: 15px;">Guardar</button>
            <button class="btn-tutorial" id="btn-cancelar-formulario-fav" style="background-color: #95A5A6;">Cancelar</button>
        </div>
    </div>
    
    <!-- Modal del Tutorial Guiado -->
    <div id="modal-tutorial" class="modal-tutorial oculto">
        <div class="contenido-tutorial">
            <h1 id="tutorial-titulo">¡Bienvenido/a!</h1>
            <p id="tutorial-texto">Texto del paso</p>
            <div class="tutorial-indicador" id="tutorial-indicador">Paso 1 de 4</div>
            <button class="btn-tutorial" id="btn-tutorial-siguiente">Siguiente</button>
        </div>
    </div>

    <!-- ¡AQUÍ ESTÁ EL NUEVO MODAL DE AVISO DE LOCALIDAD! -->
    <div id="modal-falta-localidad" class="modal-centrado oculto">
        <div class="contenido-tutorial">
            <h1 style="color: var(--verde-contigo); font-size: 1.6rem; margin-bottom: 10px;">¡Falta tu localidad! 📍</h1>
            <p style="margin-bottom: 20px;">Para poder mostrarte el tiempo exacto, necesitamos saber en qué localidad vives.</p>
            <button class="btn-tutorial" id="btn-ir-perfil-tiempo" style="background-color: var(--verde-contigo); margin-bottom: 15px;">Ir a Mi Perfil</button>
            <button class="btn-tutorial" id="btn-cancelar-tiempo" style="background-color: #95A5A6;">Cancelar</button>
        </div>
    </div>

    <!-- ¡AQUÍ ESTÁ LA NUEVA LLAMADA AL SCRIPT! -->
    <script type="module" src="boton_tiempo.js"></script>
    
    <script type="module" src="menu.js"></script>
</body>
</html>
