<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConTigo - El Tiempo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="tiempo.css">
</head>
<body>
    <!-- Contenedor general que simula la pantalla de la App (Centrado en PC y ajustado en móvil) -->
    <div class="app-container">

         <!-- 1. BLOQUE SUPERIOR: Cuadro blanco con el botón de Volver y la Ubicación al lado -->
        <header class="header-blanco">
            <button id="btn-volver-tiempo" class="btn-volver-app">← Volver</button>
            <div id="titulo-localidad" class="ubicacion-texto">Cargando...</div>
        </header>

         <!-- 2. BLOQUE MEDIO: Cuadro gris claro con el texto de estado y el botón naranja al lado -->
        <section class="caja-control-gris">
            <p id="texto-estado-semana">Estas viendo la previsión para esta semana</p>
            <button id="btn-cambiar-semana" class="btn-naranja">Ver siguiente semana</button>
        </section>

        <!-- 3. BLOQUE INFERIOR: Lista vertical de tarjetas de los días (1 Columna, 7 Filas) -->
        <main id="contenedor-dias" class="contenedor-dias">
            <!-- Los días se generan aquí -->
        </main>
    </div>
    <script type="module" src="tiempo.js"></script>
</body>
</html>
